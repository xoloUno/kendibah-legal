<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kendibah — Support &amp; Legal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inter:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf9f7;
      --text: #1a1917;
      --muted: #6b6760;
      --accent: #2b6cb0;
      --border: #e8e5e0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 400px;
      text-align: center;
    }

    .app-name {
      font-family: 'Lora', Georgia, serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .links {
      list-style: none;
      padding: 0;
    }

    .links li {
      margin-bottom: 16px;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .links a:hover { border-bottom-color: var(--accent); }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-name">Kendibah</div>
    <h1>Support &amp; Legal</h1>
    <ul class="links">
      <li><a href="mailto:hello@xolo.uno">Contact Support</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="terms.html">Terms of Service</a></li>
    </ul>
    <footer>
      <p>&copy; 2026 Erik Jimenez</p>
    </footer>
  </div>
</body>
</html>
